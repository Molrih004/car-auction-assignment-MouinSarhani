# Runs the full car-auction-starter stack: docker compose up --build
# Each service builds from its own folder and Dockerfile; nothing here is shared config.

services:
  car-service:
    build: ./car-service
    environment:
      DATABASE_URL: file:/data/database.sqlite
      PORT: 4000
      # Asked before a car is deleted
      AUCTION_SERVICE_URL: http://auction-service:4002
      # Replaces all cars with the sample data on every start; set to "false" to keep your data
      SEED_DATABASE: "true"
    volumes:
      - car-data:/data
    ports:
      - "4000:4000"

  auth-service:
    build: ./auth-service
    environment:
      DATABASE_URL: file:/data/database.sqlite
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: 7d
      # Creates/resets the demo users (buyer@, buyer2@, seller@ and staff@example.com, password supersecret1); other users are kept
      SEED_DATABASE: "true"
    volumes:
      - auth-data:/data
    ports:
      - "4001:4001"

  auction-service:
    build: ./auction-service
    environment:
      DATABASE_URL: file:/data/database.sqlite
      PORT: 4002
      CAR_SERVICE_URL: http://car-service:4000
      SCHEDULER_INTERVAL_MS: 5000
      # Replaces all auctions with the sample data on every start (times relative to now); set to "false" to keep your data
      SEED_DATABASE: "true"
    volumes:
      - auction-data:/data
    ports:
      - "4002:4002"

  api-gateway-service:
    build: ./api-gateway-service
    environment:
      PORT: 3000
      # Must be the same secret as auth-service, the gateway checks the tokens
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # Service names resolve on the compose network; localhost would point at the gateway container itself
      CAR_SERVICE_URL: http://car-service:4000
      AUTH_SERVICE_URL: http://auth-service:4001
      AUCTION_SERVICE_URL: http://auction-service:4002
    depends_on:
      - car-service
      - auth-service
      - auction-service
    ports:
      - "3000:3000"

volumes:
  car-data:
  auth-data:
  auction-data:
